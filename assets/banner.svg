        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="280" font-weight="700" letter-spacing="-14"
        fill="#262319">1,751</text>

  <text x="80" y="208"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
