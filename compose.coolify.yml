# Coolify Service definition.
#
# Build pack: Docker Compose. Compose location: /compose.coolify.yml
#
# Domains are configured in the Coolify UI, not here. Add two entries on the
# same hostname so the proxy routes by path:
#
#   https://<host>   -> service web, port 3000, path /
#   https://<host>   -> service api, port 8000, path /api
#
# Do not add Traefik labels to this file. Coolify writes its own on deploy and
# duplicates make the router ambiguous.

services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      TRAWLER_SECRET: ${TRAWLER_SECRET:?set a long random string}
      TRAWLER_CORS_ORIGINS: ${TRAWLER_PUBLIC_ORIGIN}
      TRAWLER_MAX_DOWNLOADS: "4"
      TRAWLER_MAX_PROBES: "8"
      TRAWLER_TOKEN_TTL: "3600"
      TRAWLER_COOKIES_FILE: ${TRAWLER_COOKIES_FILE:-}
    expose:
      - "8000"

  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://api:8000
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8000
    expose:
      - "3000"
